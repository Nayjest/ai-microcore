name: "Gito: AI Code Reviewer"
on:
  # `pull_request_target` (unlike `pull_request`) gives fork PRs access to secrets.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number"
        required: true
jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs require maintainer approval before any fork code touches the secrets below.
    # Same-repo PRs resolve to an empty environment name, which is a no-op, and run unattended.
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'external-pr' || '' }}
    permissions: { contents: read, pull-requests: write } # 'write' for leaving the summary comment
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # Checkout PR head to process actual changes (including forks).
        #
        # ⚠️ SECURITY: This exposes secrets to fork code. Mitigated by the 'external-pr'
        # environment on this job, which requires maintainer approval before the job starts.
        #
        # Note: the "Approval for running fork pull request workflows" setting
        # (Settings → Actions → General) does NOT gate 'pull_request_target' — it only applies
        # to 'pull_request'. The environment is what actually holds the run.
        #
        # Review PRs for secret exfiltration and other malicious code before approving.
        ref: ${{ github.event.pull_request.head.sha }}
        allow-unsafe-pr-checkout: true
        persist-credentials: false

    # Gito executes code from .gito/config.toml (`post_process`) and renders templates from .gito/,
    # so the PR must not be able to change them while secrets are available.
    - name: Use .gito from the base branch
      if: github.event_name == 'pull_request_target'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        rm -rf .gito
        git checkout "$BASE_SHA" -- .gito

    - name: Set up Python
      uses: actions/setup-python@v6
      with: { python-version: "3.13" }

    - name: Fetch Latest Gito Version
      id: gito-version
      run: pip index versions gito.bot 2>/dev/null | head -1 | sed -n 's/.* (\([^)]*\)).*/version=\1/p' >> $GITHUB_OUTPUT

    - uses: actions/cache@v5
      id: cache
      with:
        path: |
          ${{ env.pythonLocation }}/lib/python3.13/site-packages
          ${{ env.pythonLocation }}/bin
        key: gito_v${{ steps.gito-version.outputs.version }}

    - name: Install Gito
      if: steps.cache.outputs.cache-hit != 'true'
      run: pip install gito.bot~=4.4

    - name: Run AI code review
      env:
        LLM_API_TYPE: openai
        LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MODEL: gpt-5.6
        JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        JIRA_URL: ${{ secrets.JIRA_URL }}
        JIRA_USER: ${{ secrets.JIRA_USER }}
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # On `pull_request_target`, GITHUB_REF is the base branch, so Gito can't read the PR number
        # from it and falls back to this variable.
        PR_NUMBER_FROM_WORKFLOW_DISPATCH: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
      run: |
        gito --verbose review ${{ github.event.pull_request.base.ref && format(' --against="origin/{0}"', github.event.pull_request.base.ref) || '' }}
        gito github-comment

    - uses: actions/upload-artifact@v7
      with:
        name: gito-code-review-results
        path: |
          code-review-report.md
          code-review-report.json
