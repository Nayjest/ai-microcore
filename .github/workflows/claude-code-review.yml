name: Claude Code Review

on:
  # `pull_request_target` (unlike `pull_request`) gives fork PRs access to secrets and an OIDC
  # token, and always runs this workflow file as it is on the base branch.
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push supersedes a review that is still waiting for approval or running.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Fork PRs require maintainer approval before any fork code touches the secrets below.
    # Same-repo PRs resolve to an empty environment name, which is a no-op, and run unattended.
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'external-pr' || '' }}
    # Claude posts with this job's GITHUB_TOKEN (see `github_token` below), so it needs 'write'
    # here. No `id-token`: the Claude GitHub App's OIDC token exchange is not used.
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Review the actual PR changes (including forks).
          #
          # ⚠️ SECURITY: This puts fork code next to secrets. Mitigated by the 'external-pr'
          # environment on this job, which requires maintainer approval before the job starts.
          # Nothing from the checkout is executed: Claude can only read files and run `gh`
          # commands, and claude-code-action restores its own config (.claude/, CLAUDE.md,
          # .mcp.json, ...) from the base branch before starting Claude.
          #
          # Note: the "Approval for running fork pull request workflows" setting
          # (Settings → Actions → General) does NOT gate 'pull_request_target' — it only applies
          # to 'pull_request'. The environment is what actually holds the run.
          #
          # Review PRs for prompt injection and other malicious content before approving.
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # CLAUDE.md imports AGENTS.md, which claude-code-action does not restore from the base
      # branch, so the PR must not be able to change the instructions Claude is given.
      - name: Use AGENTS.md from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rm -f AGENTS.md
          if git cat-file -e "$BASE_SHA:AGENTS.md" 2>/dev/null; then
            git checkout "$BASE_SHA" -- AGENTS.md
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Claude GitHub App's token exchange rejects OIDC tokens from `pull_request_target`
          # ("Invalid OIDC token", anthropics/claude-code-action#713, #1886), so reviews post with
          # this job's GITHUB_TOKEN, as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action only runs for actors with write access. Fork PR authors don't have it, so
          # they are let through here; the 'external-pr' approval is the real gate. Setting this
          # also makes the action scrub secrets from Claude's subprocesses.
          allowed_non_write_users: ${{ env.IS_FORK == 'true' && github.event.pull_request.user.login || '' }}
          # PRs opened by the Claude implement workflow come from github-actions[bot]; re-running
          # or approving their runs keeps it as the actor.
          allowed_bots: github-actions[bot]
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # The code-review plugin launches subagents, which run in the background by default.
          # The action ends the session on the first result, before they report back, so the
          # review silently never runs (anthropics/claude-code-action#1646, #1499).
          # Forcing foreground subagents keeps the whole review in one turn. A step-level `env:`
          # does not reach Claude Code for this variable; it must go through `settings`.
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
